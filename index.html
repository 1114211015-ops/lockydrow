<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抽籤小程式</title>
    <style>
      :root {
        --bg: #f5f7ff;
        --panel: #ffffff;
        --primary: #6c5ce7;
        --primary-dark: #5644d6;
        --accent: #ffb703;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --danger: #ef4444;
        --success: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
        color: var(--text);
      }

      .app {
        width: min(90vw, 850px);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(108, 92, 231, 0.1);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(76, 75, 109, 0.12);
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 2.8rem);
        text-align: center;
        color: var(--primary-dark);
      }

      .subtitle {
        margin: 0 0 24px;
        text-align: center;
        color: var(--muted);
      }

      .panel {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 22px;
      }

      .box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
      }

      .box h2 {
        margin: 0 0 14px;
        font-size: 1.2rem;
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }

      input[type="text"],
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        color: var(--text);
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type="text"]:focus,
      textarea:focus {
        outline: none;
        border-color: rgba(108, 92, 231, 0.7);
        box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.08);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .btn-wrap {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 0.98rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        box-shadow: 0 10px 18px rgba(108, 92, 231, 0.22);
      }

      .secondary {
        background: #eef2ff;
        color: var(--primary-dark);
      }

      .danger {
        background: #fff1f2;
        color: var(--danger);
      }

      .result-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        min-height: 240px;
        background: linear-gradient(180deg, #fdfbff, #f5f3ff);
      }

      .lottery-label {
        font-size: 0.9rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .winner {
        margin: 18px 0 10px;
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(2rem, 4vw, 3.1rem);
        font-weight: 900;
        color: var(--primary-dark);
      }

      .winner.badge {
        padding: 14px 24px;
        border-radius: 18px;
        background: rgba(108, 92, 231, 0.08);
        border: 1px solid rgba(108, 92, 231, 0.18);
      }

      .stats {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #f3f4f6;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.92rem;
      }

      .chip button {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 1rem;
        font-weight: 700;
        padding: 0;
        cursor: pointer;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 760px) {
        .panel {
          grid-template-columns: 1fr;
        }

        .input-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>抽籤小程式</h1>
      <p class="subtitle">快速設定名單，讓幸運之星現身</p>

      <div class="panel">
        <section class="box">
          <h2>候選名單</h2>
          <div class="input-row">
            <input id="nameInput" type="text" placeholder="輸入姓名後按 Enter" />
            <button id="addNameBtn" class="primary" type="button">加入</button>
          </div>
          <textarea id="bulkNames" placeholder="也可以一次貼上多個名字，每行一個姓名"></textarea>
          <div class="btn-wrap" style="margin-top: 14px;">
            <button id="addBulkBtn" class="secondary" type="button">批次加入</button>
            <button id="clearAllBtn" class="danger" type="button">清空名單</button>
          </div>
          <div id="nameList" class="chips" aria-live="polite"></div>
        </section>

        <aside class="box result-box">
          <div class="lottery-label">幸運者</div>
          <div id="winner" class="winner">等待抽籤</div>
          <button id="drawBtn" class="primary" type="button">開始抽籤</button>
          <div id="stats" class="stats">目前 0 人參與</div>
        </aside>
      </div>
    </main>

    <script>
      const names = ["阿明", "小花", "小王", "小李", "小新", "琪琪", "大雄", "美美"];
      const nameInput = document.getElementById("nameInput");
      const bulkNames = document.getElementById("bulkNames");
      const nameList = document.getElementById("nameList");
      const winner = document.getElementById("winner");
      const stats = document.getElementById("stats");
      const drawBtn = document.getElementById("drawBtn");

      let isDrawing = false;
      let drawInterval = null;

      function renderList() {
        nameList.innerHTML = "";

        if (names.length === 0) {
          nameList.innerHTML = '<span class="chip">目前沒有候選人</span>';
        } else {
          names.forEach((name, index) => {
            const chip = document.createElement("div");
            chip.className = "chip";
            chip.innerHTML = `
              <span>${name}</span>
              <button type="button" aria-label="移除 ${name}">×</button>
            `;

            chip.querySelector("button").addEventListener("click", () => {
              names.splice(index, 1);
              renderList();
              updateStats();
            });

            nameList.appendChild(chip);
          });
        }

        updateStats();
      }

      function updateStats() {
        stats.textContent = `目前 ${names.length} 人參與`;
      }

      function addNamesFromInput(source) {
        const raw = source.trim();
        if (!raw) return;

        const newNames = raw
          .split(/[\n,，、]+/)
          .map((item) => item.trim())
          .filter(Boolean)
          .filter((item) => !names.includes(item));

        if (newNames.length === 0) {
          if (source.trim()) {
            alert("這些名字已經在名單裡，或是內容為空白。");
          }
          return;
        }

        names.push(...newNames);
        renderList();
      }

      function addSingleName() {
        const value = nameInput.value.trim();
        if (!value) return;

        if (!names.includes(value)) {
          names.push(value);
        }

        nameInput.value = "";
        nameInput.focus();
        renderList();
      }

      function stopDrawing() {
        if (drawInterval) {
          clearInterval(drawInterval);
          drawInterval = null;
        }
        isDrawing = false;
        drawBtn.textContent = "開始抽籤";
        drawBtn.disabled = false;
      }

      function drawWinnerName() {
        if (names.length === 0) {
          winner.textContent = "沒有名單";
          winner.classList.remove("badge");
          return;
        }

        const selected = names[Math.floor(Math.random() * names.length)];
        winner.textContent = selected;
        winner.classList.add("badge");
      }

      function startDraw() {
        if (names.length === 0) {
          winner.textContent = "沒有名單";
          winner.classList.remove("badge");
          return;
        }

        if (isDrawing) {
          stopDrawing();
          return;
        }

        isDrawing = true;
        drawBtn.textContent = "停止";
        drawBtn.disabled = true;

        let step = 0;
        drawInterval = setInterval(() => {
          const current = names[step % names.length];
          winner.textContent = current;
          winner.classList.add("badge");
          step += 1;
        }, 80);

        setTimeout(() => {
          if (!isDrawing) return;

          clearInterval(drawInterval);
          drawInterval = null;

          const finalWinner = names[Math.floor(Math.random() * names.length)];
          winner.textContent = finalWinner;
          winner.classList.add("badge");

          isDrawing = false;
          drawBtn.textContent = "重新抽籤";
          drawBtn.disabled = false;
        }, 1600);
      }

      document.getElementById("addNameBtn").addEventListener("click", addSingleName);
      document.getElementById("addBulkBtn").addEventListener("click", () => {
        addNamesFromInput(bulkNames.value);
        bulkNames.value = "";
      });
      document.getElementById("drawBtn").addEventListener("click", startDraw);
      document.getElementById("clearAllBtn").addEventListener("click", () => {
        names.length = 0;
        winner.textContent = "等待抽籤";
        winner.classList.remove("badge");
        renderList();
      });

      nameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addSingleName();
        }
      });

      renderList();
    </script>
  </body>
</html>
